# Gitea CI, on the Mac Studio's self-hosted runner. The GitHub workflow in .github/workflows/ci.yml
# runs the same two jobs on GitHub's Linux runners; keep them in step.
#
# Gitea reads .gitea/workflows/ in preference to .github/workflows/, so the GitHub workflows --
# including conformance-real-corpus.yml, which must only ever touch the real corpus on a machine
# chosen for it -- do not run here.
#
# Pinned to the Studio (stuart-m3ultra-canary): its runner is a separate `gitearunner` account,
# where the other macOS runner is the account every Kindled session on that machine shares.
#
# Homebrew first, always: every step runs under Homebrew's bash, and each job puts Homebrew at the
# front of PATH and then verifies it. Node is Homebrew's too, not setup-node's: this runner gives
# every job a fresh, empty tool cache, so setup-node downloaded Node on every job. The guard fails
# the job if Homebrew's node does not match .nvmrc. pre-commit goes into a throwaway virtual environment, never
# into a host Python.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # A PR's runs share its ref; each push to main gets its own group, so a newer one cannot cancel it even while pending.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Cancel a superseded run on a PR only: every push to main keeps its own verdict (midst-infra #102).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: /opt/homebrew/bin/bash -eo pipefail {0}
jobs:
  gates:
    runs-on: stuart-m3ultra-canary
    env:
      NVMRC: .nvmrc
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fail loudly rather than fall back to what macOS ships (bash 3.2, Python 3.9). The runner
      # account's own PATH is not ours to rely on, so this job puts Homebrew first itself and then
      # checks that it took.
      - name: toolchain guard (Homebrew first, current versions)
        run: bash .gitea/scripts/toolchain_guard.sh "$NVMRC"
      - run: npm ci --ignore-scripts
      # TipTap 2.5.4 for the conformance oracle, which models the old app (conformance/oracle, #102).
      - run: npm ci --ignore-scripts --prefix conformance/oracle
      - name: pre-commit, in a throwaway virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/precommit"
          "$RUNNER_TEMP/precommit/bin/pip" install --quiet 'pre-commit==4.6.2'
          # conformance-synthetic needs the built harness (out/converter.cjs); the job below builds it and runs it.
          SKIP=conformance-synthetic "$RUNNER_TEMP/precommit/bin/pre-commit" run --all-files --show-diff-on-failure

  conformance:
    name: conformance, synthetic corpus
    runs-on: stuart-m3ultra-canary
    env:
      NVMRC: midst-format/.nvmrc
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: midst-format }
      # Fail loudly rather than fall back to what macOS ships (bash 3.2, Python 3.9). The runner
      # account's own PATH is not ours to rely on, so this job puts Homebrew first itself and then
      # checks that it took.
      - name: toolchain guard (Homebrew first, current versions)
        run: bash midst-format/.gitea/scripts/toolchain_guard.sh "$NVMRC"
      - run: npm ci --ignore-scripts
      # TipTap 2.5.4 for the conformance oracle, which models the old app (conformance/oracle, #102).
      - run: npm ci --ignore-scripts --prefix conformance/oracle
        working-directory: midst-format
      - name: the transcribed TipTap config and rules must still match src/
        working-directory: midst-format
        run: npm run provenance
      - name: build the harness from src/convert.ts
        working-directory: midst-format
        run: npm run build:harness
      - name: build the library from src/
        working-directory: midst-format
        run: npm run build:lib
      - name: parity, two builds of src/ (harness esbuild and build:lib), synthetic corpus
        working-directory: midst-format
        run: MIDST_CORPUS=fixtures/synthetic npm run parity
      - name: the library type-checks for TypeScript 4.6 consumers
        working-directory: midst-format
        run: npm run consumer-ts46
      - name: the library build is reproducible
        working-directory: midst-format
        run: npm run reproducible
      - name: self-tests (Jest) - the text oracle, and a failing poem leaves no text in any output
        working-directory: midst-format
        run: npm test
      - name: conformance, synthetic corpus only
        working-directory: midst-format
        # The real corpus is poem data and never runs here. See DATA.md.
        run: MIDST_CORPUS=fixtures/synthetic node conformance/verify_all.cjs
      - name: converter coverage from the synthetic corpus (numbers only)
        working-directory: midst-format
        run: npm run conformance:coverage
      - name: mark-loss detector
        working-directory: midst-format
        run: MIDST_CORPUS=fixtures/synthetic node conformance/markloss.cjs
      - name: browser line check (Chromium), fixtures only
        working-directory: midst-format
        run: |
          npx playwright install chromium
          npm run render-lines
      - name: generated shapes (seeded; invented letters only, never poem data)
        working-directory: midst-format
        run: |
          npm run shapes-fuzz
          npm run shapes-fuzz:open-controls
