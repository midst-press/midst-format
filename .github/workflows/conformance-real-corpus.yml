# The REAL corpus: 58 poem timelapses. Manual only, and it must run where the data is.
# It publishes pass/fail and paragraph deltas. It must never publish poem text.
name: conformance (real corpus)
on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: absolute path to the directory of .midst.zip files on the runner
        required: true
permissions:
  contents: read
jobs:
  conformance:
    # Self-hosted: the corpus is not on GitHub and must not be uploaded to it.
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: midst-format }
      - run: npm ci
        working-directory: midst-format
      - name: build harness
        working-directory: midst-format
        run: npm run build:harness
      - name: run conformance
        working-directory: midst-format
        # An explicit shell gives `bash -eo pipefail`. Without it the step is `bash -e` and takes tee's
        # exit status, so a failing verify_all still left this step green.
        shell: bash
        env:
          MIDST_CORPUS: ${{ inputs.corpus_path }}
          MIDST_OUT: ${{ runner.temp }}/converted
        run: node conformance/verify_all.cjs | tee "${{ runner.temp }}/summary.txt"
      - name: publish ONLY the summary table, never the poems or the conversions
        # always(): the summary matters most on the run that failed.
        if: always()
        run: |
          echo '### Conformance, real corpus' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(PASS|FAIL|ERR|controls|$)' "${{ runner.temp }}/summary.txt" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: remove the conversions from the runner
        if: always()
        run: rm -rf "${{ runner.temp }}/converted"
