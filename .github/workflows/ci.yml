# The gates. Defined ONCE in .pre-commit-config.yaml and run by the same command
# locally (git hook) and here, so they cannot drift apart.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.14"
      - run: npm ci --ignore-scripts
      # pre-commit's hook environments, kept between runs as the Gitea runner keeps them: an empty cache rebuilds them
      # on every job. Keyed on the config that defines them and the Python they were built with.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (the same hooks your commit runs)
        run: |
          pip install 'pre-commit==4.6.2'
          # conformance-synthetic needs the built harness (out/converter.cjs), which this
          # job does not have. The conformance job below builds it and runs the suite properly.
          SKIP=conformance-synthetic pre-commit run --all-files --show-diff-on-failure

  conformance:
    name: conformance, synthetic corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: midst-format }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: midst-format/.nvmrc
          cache: npm
          cache-dependency-path: midst-format/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: midst-format
      - name: the transcribed TipTap config and rules must still match src/
        working-directory: midst-format
        run: npm run provenance
      - name: build the harness from src/convert.ts
        working-directory: midst-format
        run: npm run build:harness
      - name: build the library from src/
        working-directory: midst-format
        run: npm run build:lib
      - name: parity, two builds of src/ (harness esbuild and build:lib), synthetic corpus
        working-directory: midst-format
        run: MIDST_CORPUS=fixtures/synthetic npm run parity
      - name: the library type-checks for TypeScript 4.6 consumers
        working-directory: midst-format
        run: npm run consumer-ts46
      - name: the library build is reproducible
        working-directory: midst-format
        run: npm run reproducible
      - name: self-tests (Jest) - the text oracle, and a failing poem leaves no text in any output
        working-directory: midst-format
        run: npm test
      - name: conformance, synthetic corpus only
        working-directory: midst-format
        # The real corpus is poem data and never runs here. See DATA.md.
        run: MIDST_CORPUS=fixtures/synthetic node conformance/verify_all.cjs
      - name: converter coverage from the synthetic corpus (numbers only)
        working-directory: midst-format
        run: npm run conformance:coverage
      - name: mark-loss detector
        working-directory: midst-format
        run: MIDST_CORPUS=fixtures/synthetic node conformance/markloss.cjs
      - name: browser line check (Chromium), fixtures only
        working-directory: midst-format
        run: |
          npx playwright install --with-deps chromium
          npm run render-lines
      - name: generated shapes (seeded; invented letters only, never poem data)
        working-directory: midst-format
        run: |
          npm run shapes-fuzz
          npm run shapes-fuzz:open-controls
