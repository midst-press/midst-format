# The gates. Defined ONCE in .pre-commit-config.yaml and run by the same command
# locally (git hook) and here, so they cannot drift apart.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${ github.workflow }-${ github.ref }
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: pre-commit (the same hooks your commit runs)
        run: |
          pip install 'pre-commit==4.6.0'
          pre-commit run --all-files --show-diff-on-failure

  conformance:
    name: conformance, synthetic corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with: { path: midst-format }
      - name: check out midst-editor, whose util.ts is the converter under test
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          repository: midst-press/midst-editor
          path: midst-editor
          token: ${{ secrets.MIDST_REPO_READ_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version-file: midst-format/.nvmrc
          cache: npm
          cache-dependency-path: midst-format/package-lock.json
      - run: npm ci
        working-directory: midst-format
      - name: the transcribed TipTap config must still match upstream
        working-directory: midst-format
        env:
          MIDST_EDITOR_UTIL_TS: ${{ github.workspace }}/midst-editor/src/main/util.ts
        run: npm run provenance
      - name: build the harness from midst-editor's REAL source
        working-directory: midst-format
        env:
          MIDST_EDITOR_SRC: ${{ github.workspace }}/midst-editor
        run: npm run build:harness
      - name: conformance, synthetic corpus only
        working-directory: midst-format
        # The real corpus is poem data and never runs here. See DATA.md.
        run: MIDST_CORPUS=fixtures/synthetic node conformance/verify_all.cjs
      - name: mark-loss detector
        working-directory: midst-format
        run: MIDST_CORPUS=fixtures/synthetic node conformance/markloss.cjs
