# The gates. Defined ONCE in .pre-commit-config.yaml and run by the same command
# locally (git hook) and here, so they cannot drift apart.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: npm ci
      - name: pre-commit (the same hooks your commit runs)
        run: |
          pip install 'pre-commit==4.6.2'
          # conformance-synthetic needs the harness built from a midst-editor checkout, which this
          # job does not have. The conformance job below builds it and runs the suite properly.
          SKIP=conformance-synthetic pre-commit run --all-files --show-diff-on-failure

  conformance:
    name: conformance, synthetic corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: midst-format }
      - name: check out midst-editor, whose util.ts is the converter under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: midst-press/midst-editor
          path: midst-editor
          token: ${{ secrets.MIDST_REPO_READ_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: midst-format/.nvmrc
          cache: npm
          cache-dependency-path: midst-format/package-lock.json
      - run: npm ci
        working-directory: midst-format
      - name: the transcribed TipTap config must still match upstream
        working-directory: midst-format
        env:
          MIDST_EDITOR_UTIL_TS: ${{ github.workspace }}/midst-editor/src/main/util.ts
        run: npm run provenance
      - name: build the harness from midst-editor's REAL source
        working-directory: midst-format
        env:
          MIDST_EDITOR_SRC: ${{ github.workspace }}/midst-editor
        run: npm run build:harness
      - name: text oracle self-test
        working-directory: midst-format
        run: node conformance/textexact_selftest.cjs
      - name: conformance, synthetic corpus only
        working-directory: midst-format
        # The real corpus is poem data and never runs here. See DATA.md.
        run: MIDST_CORPUS=fixtures/synthetic node conformance/verify_all.cjs
      - name: a failing poem leaves no text in any output
        working-directory: midst-format
        run: npm run test:no-text
      - name: mark-loss detector
        working-directory: midst-format
        run: MIDST_CORPUS=fixtures/synthetic node conformance/markloss.cjs
      - name: browser line check (Chromium), fixtures only
        working-directory: midst-format
        run: |
          npx playwright install --with-deps chromium
          npm run render-lines
